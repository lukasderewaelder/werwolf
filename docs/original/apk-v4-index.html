/* ================= Spiel ================= */
function phaseLabel(g){
  const P = {deal:[I.eye,'Rollen zeigen'], intro:[I.moon,'Vorbereitung'], night:[I.moon,`Nacht ${g.night}`], day:[I.sun,`Tag ${g.day}`],
    interrupt:[g.resume === 'day' ? I.sun : I.moon, g.resume === 'day' ? `Tag ${g.day}` : `Nacht ${g.night}`], ended:[I.crown,'Spielende']}[g.phase] || [I.moon,''];
  return `${P[0]}<span>${P[1]}</span>`;
}
function stepHead(g, c){
  if (!c) return art(null, 'ph');
  if (c.step.key === 'lovers') return art('cupid', 'ph');
  if (c.step.key === 'enchanted') return art('piper', 'ph');
  return art(c.step.role, 'ph');
}
function renderGame(){
  const g = state.game;
  const isNight = g.phase === 'night';
  const c = isNight ? ctxOf(g) : null;
  const n = state.players.length, o = state.options;
  let card = '', foot = '', main = null;

  if (g.phase === 'deal'){
    const p = state.players[g.dealIdx], r = RM[g.roles[p.id]];
    const last = g.dealIdx === n - 1;
    card = `<section class="card">
      <div class="card-head">${emblem('ph')}<h1 class="title"><small>Rollen zeigen · ${g.dealIdx + 1} von ${n}</small>Gehe zu ${esc(p.name)}</h1>
        <button class="mini" data-action="overview" aria-label="Übersicht">${I.list}</button></div>
      <p class="say">„Alle schließen die Augen. Nur ${esc(p.name)} schaut aufs Display.“</p>
      <div class="dots">${state.players.map((x, i) => `<i class="${i < g.dealIdx ? 'done' : i === g.dealIdx ? 'cur' : ''}"></i>`).join('')}</div>
    </section>`;
    main = `<section class="deal" data-action="deal-toggle">${g.dealShown ? `
      <div class="rolecard face" style="--rc:${r.color}">
        <div class="rc-player">${esc(p.name)}, du bist …</div>
        ${art(r.id, 'rc-art')}
        <div class="rc-name">${esc(r.name)}</div>
        <div class="rc-team">${TEAM[r.team]}</div>
        <p class="rc-desc">${esc(r.desc)}</p>
      </div>` : `
      <div class="rolecard back">
        ${emblem('big')}
        <div class="rc-name">${esc(p.name)}</div>
        <div class="rc-team">${I.eye} Antippen zum Aufdecken</div>
      </div>`}</section>`;
    foot = `<button class="btn" data-action="deal-prev" ${g.dealIdx === 0 && !g.dealShown ? 'disabled' : ''}>${I.left}<span>Zurück</span></button>
      ${g.dealShown
        ? `<button class="btn primary" data-action="deal-next">${last ? I.check : I.right}<span>${last ? 'Verdecken – fertig' : 'Verdecken & weiter'}</span></button>`
        : `<button class="btn primary" data-action="deal-toggle">${I.eye}<span>Rolle zeigen</span></button>`}`;
  } else if (g.phase === 'intro'){
    card = `<section class="card">
      <div class="card-head">${emblem('ph')}<h1 class="title"><small>Gleich geht’s los</small>Die erste Nacht</h1></div>
      <p class="say">„In unserem Dorf am Waldrand geschehen seltsame Dinge. Man munkelt, dass sich unter uns Werwölfe verbergen – Menschen am Tag, Bestien in der Nacht. Die Sonne geht unter … Alle schließen die Augen.“</p>
    </section>`;
    main = `<section class="intro">
      <div class="intro-emblem">${emblem('big')}</div>
      <div class="check">${I.check}<span>Alle sitzen im Kreis – in der Reihenfolge der App</span></div>
      <div class="check">${I.check}<span>${g.digital ? 'Jeder hat seine Rolle gesehen' : 'Jeder hat seine Karte angeschaut und verdeckt abgelegt'}</span></div>
      ${Object.keys(g.groups).length ? `<div class="check">${I.people}<span>Verkünde die zwei Gruppen des Dorfes – Gruppe 1: ${esc(groupNames(g,'A'))} · Gruppe 2: ${esc(groupNames(g,'B'))}</span></div>` : ''}
      ${g.actorPool.length ? `<div class="check">${I.mask}<span>Lege für den Gaukler offen in die Mitte: ${esc(g.actorPool.map(x => RM[x].name).join(', '))}</span></div>` : ''}
      <div class="check">${I.check}<span>Licht dimmen, Handy auf lautlos</span></div>
      <div class="check">${I.check}<span>Du sprichst ruhig und gleichmäßig – auch bei toten Rollen</span></div>
    </section>`;
    foot = `<button class="btn" data-action="go" data-view="home">${I.home}<span>Menü</span></button>
      <button class="btn primary" data-action="begin-night">${I.moon}<span>Die Nacht bricht herein</span></button>`;
  } else if (isNight){
    if (!c){
      card = `<section class="card"><div class="card-head">${emblem('ph')}<h1 class="title">Stille Nacht</h1></div>
        <p class="say">„Alle schließen die Augen …“ – in dieser Nacht wacht niemand auf.</p></section>`;
      foot = `<button class="btn primary" data-action="next">${I.sun}<span>Tag beginnen</span></button>`;
    } else {
      const isLast = g.stepIdx === c.steps.length - 1;
      card = `<section class="card">
        <div class="card-head">${stepHead(g, c)}
          <button class="title-btn" data-action="steps-modal" aria-label="Ablauf der Nacht anzeigen">
            <span class="title">${esc(c.step.label)}</span>
            <small>Schritt ${g.stepIdx + 1} von ${c.steps.length}${c.step.gone ? ' · nicht mehr im Spiel' : ''} ${I.down}</small>
          </button></div>
        <div class="stepbar">${c.steps.map((s, i) => `<button class="sb ${i < g.stepIdx ? 'done' : ''} ${i === g.stepIdx ? 'cur' : ''}" data-action="jump" data-idx="${i}" aria-label="${esc(s.label)}"><i></i></button>`).join('')}</div>
        <p class="say">„${esc(g.stepIdx === 0 ? 'Alle schließen die Augen. ' : '')}${esc(c.step.say || '')}“</p>
        ${stepBox(g, c)}
      </section>`;
      const toAction = !g.digital && g.night === 1 && c.mode === 'assign' && c.step.act && c.complete;
      foot = `<button class="btn" data-action="prev" ${g.stepIdx === 0 && c.mode !== 'action' ? 'disabled' : ''}>${I.left}<span>Zurück</span></button>
        ${toAction ? `<button class="btn primary" data-action="submode" data-mode="action"><span>Zur Aktion</span>${I.right}</button>`
                   : `<button class="btn primary" data-action="next"><span>${isLast ? 'Tag beginnen' : 'Weiter'}</span>${isLast ? I.sun : I.right}</button>`}`;
    }
  } else if (g.phase === 'day'){
    const deaths = g.lastDeaths.map(id => `${nm(id)} (${roleName(g, id)})`);
    const capAlive = g.captain && alive(g, g.captain);
    const sg = livingHolders(g, 'scapegoat')[0];
    card = `<section class="card">
      <div class="card-head"><span class="rbg ph sunbg">${I.sun}</span><h1 class="title">Das Dorf erwacht</h1></div>
      <p class="say">„${deaths.length ? `Heute Nacht hat es uns ${deaths.length === 1 ? 'eine Person' : deaths.length + ' Personen'} gekostet …` : 'Wie durch ein Wunder ist in dieser Nacht niemand gestorben!'}“</p>
      ${deaths.length || g.morning.length ? `<ul class="morning">${deaths.map(t => `<li>† ${esc(t)}</li>`).join('')}${g.morning.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      <div class="timer">
        <span class="timer-val ${timer.left === 0 ? 'alarm' : ''}" id="timer-val">${fmt(timer.left)}</span>
        <button class="act small" data-action="timer-toggle">${timer.running ? I.pause : I.play}<span>${timer.running ? 'Pause' : 'Diskussion'}</span></button>
        <button class="act small" data-action="timer-preset">${fmt(o.timer)}</button>
        <button class="act small" data-action="timer-reset" aria-label="Timer zurücksetzen">${I.reset}</button>
      </div>
      <div class="task ${g.draft.vote ? 'ok' : ''}">
        ${o.captain ? `<div class="seg compact"><button class="${g.dayMode === 'captain' ? 'on' : ''}" data-action="daymode" data-mode="captain">${I.crown}${capAlive ? esc(nm(g.captain)) : 'Hauptmann wählen'}</button><button class="${g.dayMode === 'vote' ? 'on' : ''}" data-action="daymode" data-mode="vote">${I.gavel}Abstimmung</button></div>` : ''}
        ${g.secondVote ? '<div class="note">Zweite Abstimmung auf Verlangen des Richters!</div>' : ''}
        ${g.voters && g.votersDay === g.day ? `<div class="note">Nur diese dürfen abstimmen: ${esc(g.voters.map(nm).join(', ') || 'niemand')}</div>` : ''}
        <div class="prompt">${g.draft.vote ? I.check : I.right}<span>${g.dayMode === 'captain' ? 'Tippe den gewählten Hauptmann an.' : g.draft.vote ? `Das Dorf richtet ${esc(nm(g.draft.vote))} hin.` : 'Tippe an, wen das Dorf hinrichtet.'}</span></div>
        ${livingHolders(g,'judge').length && !g.judgeUsed && powerOn(g,'judge') && g.dayMode === 'vote' ? `<div class="act-bar"><button class="act small ${g.judgeArmed ? 'on' : ''}" data-action="judge-sign">${I.scale}<span>${g.judgeArmed ? 'Richter-Zeichen gegeben' : 'Richter gibt sein Zeichen'}</span></button></div>` : ''}
      </div>
    </section>`;
    foot = `<button class="btn" data-action="day-none"><span>Ohne Opfer</span></button>
      ${sg ? `<button class="btn" data-action="day-tie"><span>Gleichstand</span></button>` : ''}
      <button class="btn primary" data-action="day-kill" ${!g.draft.vote ? 'disabled' : ''}>${I.gavel}<span>Hinrichten</span></button>`;
  } else if (g.phase === 'interrupt'){
    const it = g.interrupts[0];
    const T = {
      hunter: () => ['hunter', 'Letzter Schuss', `${nm(it.id)} war der Jäger und reißt mit letzter Kraft jemanden mit in den Tod.`, 'Ziel des Jägers antippen.', 'Kein Schuss'],
      captain: () => ['captain', 'Nachfolge', `${nm(it.id)} war Hauptmann und bestimmt nun einen Nachfolger.`, 'Neuen Hauptmann antippen.', 'Kein Nachfolger'],
      maid: () => ['maid', 'Ergebene Magd', `Bevor die Karte von ${nm(it.victim)} aufgedeckt wird: Will die ergebene Magd (${nm(it.id)}) sich offenbaren und diese Rolle übernehmen?`, `${nm(it.victim)} war: ${RM[g.roles[it.victim]].name}. Frage die Magd heimlich per Zeichen.`, 'Nicht übernehmen'],
      scapegoat: () => ['scapegoat', 'Rache des Sündenbocks', `${nm(it.id)} stirbt als Sündenbock und bestimmt, wer morgen abstimmen darf.`, `Tippe alle an, die morgen abstimmen dürfen (${(it.picks || []).length} gewählt).`, 'Fertig']
    }[it.type]();
    card = `<section class="card">
      <div class="card-head">${art(T[0], 'ph')}<h1 class="title"><small>${T[1]}</small>${esc(nm(it.id))}</h1></div>
      <p class="say">„${esc(T[2])}“</p>
      <div class="prompt warn">${esc(T[3])}</div>
    </section>`;
    foot = it.type === 'maid'
      ? `<button class="btn" data-action="interrupt-skip"><span>${T[4]}</span></button><button class="btn primary" data-action="maid-take">${I.broom}<span>Rolle übernehmen</span></button>`
      : `<button class="btn primary" data-action="interrupt-skip"><span>${T[4]}</span>${I.right}</button>`;
  } else {
    const w = g.winner || '';
    const wr = /Werw|weiße/.test(w) ? (/weiße/.test(w) ? 'whitewolf' : 'wolf') : /Liebes/.test(w) ? 'cupid' : /Flöt/.test(w) ? 'piper' : /Engel/.test(w) ? 'angel' : 'villager';
    card = `<section class="card win">
      <div class="card-head">${art(wr, 'ph big')}<h1 class="title"><small>Spielende nach ${g.day} ${g.day === 1 ? 'Tag' : 'Tagen'}</small>Sieg: ${esc(w)}</h1></div>
      <p class="say">„Der Morgen bricht an – und die Wahrheit kommt ans Licht.“ Alle Rollen sind jetzt aufgedeckt.</p>
    </section>`;
    foot = `<button class="btn" data-action="go" data-view="home">${I.home}<span>Hauptmenü</span></button>
      <button class="btn primary" data-action="restart">${I.reset}<span>Neue Runde</span></button>`;
  }

  if (!main){
    const cols = n <= 4 ? 2 : n <= 9 ? 3 : n <= 16 ? 4 : 5;
    const hint = c && c.mode === 'assign' ? 'Erwachte Spieler antippen' : `${living(g)} von ${n} leben`;
    main = `<section class="players">
      <div class="players-head"><h2>Das Dorf</h2><span>${hint}</span></div>
      <div class="pgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${state.players.map((p, i) => playerCard(g, p, i, c)).join('')}</div>
    </section>`;
  }
  return `
    <header class="topbar">
      ${iconBtn('go', I.home, 'Hauptmenü', 'data-view="home"')}
      <div class="grow"><div class="status">${phaseLabel(g)}</div></div>
      ${iconBtn('undo', I.undo, 'Rückgängig', !undoStack.length ? 'disabled' : '')}
      ${iconBtn('open-menu', I.menu, 'Menü')}
    </header>
    ${card}${main}
    <footer class="bar">${foot}</footer>`;
}

function playerCard(g, p, idx, c){
  const id = p.id, rid = g.roles[id], r = rid ? RM[rid] : null, dead = !alive(g, id);
  const show = state.options.revealRoles || g.phase === 'ended' || dead || (rid && RM[rid].open);
  const d = g.draft;
  let cls = '', badges = [];

  if (g.phase === 'night' && c){
    const s = c.step;
    if (s.role && holders(g, s.role).some(x => x.id === id)) cls = 'is-role';
    if (c.mode === 'action'){
      const pick = cond => { if (cond) cls = 'is-pick'; };
      if (['kill', 'witch', 'infect', 'bigkill'].includes(s.act)){
        if (d.kill === id) cls = d.heal || d.protect === id ? 'is-safe' : 'is-target';
        if (d.bigkill === id) cls = 'is-target';
      }
      if (s.act === 'witch' && d.poison === id) cls = 'is-target';
      if (s.act === 'check') pick(d.check === id);
      if (s.act === 'lovers') pick(d.lovers.includes(id));
      if (s.act === 'protect' && d.protect === id) cls = 'is-safe';
      if (s.act === 'whitekill' && d.whitekill === id) cls = 'is-target';
      if (s.act === 'model') pick(d.model === id);
      if (s.act === 'fox' && d.fox) pick(id === d.fox || seatNeighbors(g, d.fox).includes(id));
      if (s.act === 'mark') pick(d.mark === id);
      if (s.act === 'enchant') pick(d.enchant.includes(id));
    }
    if (d.kill === id) badges.push(`<span class="bdg ${d.heal || d.protect === id ? 'grn' : 'red'}">${I.wolf}</span>`);
    if (d.protect === id) badges.push(`<span class="bdg grn">${I.shield}</span>`);
    if (d.poison === id) badges.push(`<span class="bdg red">${I.poison}</span>`);
  }
  if (g.phase === 'day' && g.draft.vote === id) cls = 'is-target';
  if (g.phase === 'day' && g.dayMode === 'captain' && g.captain === id) cls = 'is-pick';
  if (dead) cls += ' dead';

  if (g.captain === id && !dead) badges.push(`<span class="bdg gold">${I.crown}</span>`);
  if (g.lovers.includes(id)) badges.push(`<span class="bdg red">${I.heart}</span>`);
  if (g.enchanted[id]) badges.push(`<span class="bdg">${I.note}</span>`);
  if (g.ravenMark === id && !dead) badges.push(`<span class="bdg">+2</span>`);
  if (show && isWolf(g, id) && !WOLF_IDS.includes(rid)) badges.push(`<span class="bdg red">${I.wolf}</span>`);
  if (g.groups[id] && cnt('greis')) badges.push(`<span class="bdg">${g.groups[id] === 'A' ? '1' : '2'}</span>`);
  if (g.voters && g.votersDay === g.day && g.phase === 'day' && !g.voters.includes(id) && !dead) badges.push(`<span class="bdg red">${I.close}</span>`);
  if (g.phase === 'interrupt' && g.interrupts[0]?.type === 'scapegoat' && (g.interrupts[0].picks || []).includes(id)) cls = 'is-pick';
  if (rid === 'witch' && show && !dead) badges.push(`<span class="bdg ${g.potions.heal ? 'used' : 'grn'}">${I.heal}</span><span class="bdg ${g.potions.poison ? 'used' : 'red'}">${I.poison}</span>`);
  if (g.idiotRevealed && rid === 'idiot') badges.push(`<span class="bdg gold">${I.minus}</span>`);

  let label = !r ? (g.phase === 'night' ? 'offen' : '–') : show ? roleName(g, id) : 'geheim';
  if (dead) label = `† ${r ? r.name : ''}`;
  const face = r && show
    ? `<span class="pc-art rbg" style="--rc:${r.color}">${portrait(rid)}</span>`
    : `<span class="pc-art pc-back"><b>${idx + 1}</b></span>`;
  return `<button class="pc ${cls}" data-action="tap" data-id="${esc(id)}">
    ${face}${dead ? `<span class="pc-skull">${I.skull}</span>` : ''}
    <span class="pc-badges">${badges.slice(0, 4).join('')}</span>
    <span class="pc-label"><span class="pc-name">${esc(p.name)}</span><span class="pc-role ${!r ? 'open' : ''}">${esc(label)}</span></span>
  </button>`;
}

/* ================= Menü & Dialoge ================= */
const CONFIRM = {
  restart: ['Neue Runde?', 'Die laufende Runde wird beendet. Spieler und Rollen bleiben gleich.', 'restart-now', 'Neue Runde'],
  start: ['Laufendes Spiel ersetzen?', 'Es läuft noch ein Spiel. Mit dem Start eines neuen Spiels geht es verloren.', 'start-now', 'Neues Spiel starten'],
  clear: ['Alle Spieler löschen?', 'Die komplette Spielerliste wird geleert. Rollen und Optionen bleiben erhalten.', 'clear-now', 'Alle löschen'],
  reset: ['Alles zurücksetzen?', 'Spieler, Rollen und Optionen werden auf den Standard gesetzt.', 'reset-now', 'Zurücksetzen']
};
function renderModal(){
  if (!modal) return '';
  const g = state.game;
  let inner = '', sheet = false;
  const head = t => `<div class="card-head"><h3 class="title">${t}</h3><button class="mini" data-action="close-modal" aria-label="Schließen">${I.close}</button></div>`;
  if (modal === 'menu'){
    sheet = true;
    const tile = (action, icon, label, attrs = '') => `<button class="tilebtn" data-action="${action}" ${attrs}>${icon}<span>${label}</span></button>`;
    inner = `<div class="grab"></div>${head('Spielleiter-Menü')}
      <div class="sheet-grid">
        ${tile('undo', I.undo, 'Rückgängig', !undoStack.length ? 'disabled' : '')}
        ${tile('show-log', I.list, 'Protokoll')}
        ${tile('show-roles', I.book, 'Spickzettel')}
        ${tile('seats', I.people, 'Sitzordnung')}
        ${g && (g.phase === 'night' || g.phase === 'day') ? tile('toggle-phase', g.phase === 'night' ? I.sun : I.moon, g.phase === 'night' ? 'Nacht beenden' : 'Tag beenden') : ''}
        ${g && g.digital ? tile('overview', I.people, 'Wer ist was?') : ''}
        ${tile('opt', state.options.revealRoles ? I.eye : I.peek, state.options.revealRoles ? 'Rollen verbergen' : 'Rollen zeigen', 'data-key="revealRoles"')}
        ${g && !g.digital && g.phase === 'night' && g.night === 1 ? tile('random-roles', I.dice, 'Zufällig zuteilen') : ''}
        ${tile('go', I.sliders, 'Optionen', 'data-view="settings"')}
        ${IS_APP ? '' : tile('download-html', I.download, 'Als Datei sichern')}
        ${tile('go', I.home, 'Hauptmenü', 'data-view="home"')}
      </div>
      <button class="btn primary" data-action="ask" data-what="restart">${I.reset}<span>Neue Runde starten</span></button>`;
  } else if (modal === 'log'){
    inner = `${head('Spielprotokoll')}
      <div class="log">${(g?.log || []).length ? g.log.slice().reverse().map(e => `<div><b>${esc(e.p)}</b>${esc(e.t)}</div>`).join('') : '<div>Noch keine Einträge.</div>'}</div>`;
  } else if (modal === 'overview'){
    inner = `${head('Wer ist was? <small>nur für dich</small>')}
      <div class="ov-grid">${state.players.map(p => { const r = RM[g.roles[p.id]]; return `<div class="ov">${art(r.id)}<b>${esc(p.name)}</b><small>${esc(r.name)}</small></div>`; }).join('')}</div>
      ${g.middle.length ? `<div class="prompt warn">In der Mitte: ${g.middle.map(x => esc(RM[x].name)).join(' & ')}</div>` : ''}
      ${g.phase === 'deal' ? `<button class="btn" data-action="deal-reroll">${I.dice}<span>Alles neu auslosen</span></button>` : ''}`;
  } else if (modal === 'roles' || modal.startsWith('role:')){
    const list = modal === 'roles' ? ROLES.filter(r => cnt(r.id) > 0) : [RM[modal.slice(5)]];
    if (list.length === 1 && modal !== 'roles'){
      const r = list[0];
      inner = `${head(esc(r.name))}
        <div class="rdetail">${art(r.id, 'rd-art')}<div><span class="rc-team">${TEAM[r.team]} · ${SETS[r.set]}</span><p>${esc(r.desc)}</p>
        ${r.say ? `<p class="say">„${esc(r.say)}“</p>` : ''}</div></div>`;
    } else {
      inner = `${head('Spickzettel')}${list.map(r => `<div class="rinfo">${art(r.id)}<div><b>${esc(r.name)}${cnt(r.id) > 1 ? ' ×' + cnt(r.id) : ''}</b><p>${esc(r.desc)}</p></div></div>`).join('')}`;
    }
  } else if (modal.startsWith('player:')){
    const p = state.players.find(x => x.id === modal.slice(7));
    if (!p){ modal = null; return ''; }
    const i = state.players.indexOf(p);
    inner = `${head(`Platz ${i + 1}`)}
      <form id="rename-form" class="add"><input class="inp" id="rename-inp" value="${esc(p.name)}" maxlength="20" autocomplete="off" enterkeyhint="done"><button type="submit" class="icon-btn add-btn" aria-label="Speichern">${I.check}</button></form>
      <div class="seg">
        <button data-action="move" data-id="${esc(p.id)}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>${I.up}Nach vorne</button>
        <button data-action="move" data-id="${esc(p.id)}" data-dir="1" ${i === state.players.length - 1 ? 'disabled' : ''}>${I.down}Nach hinten</button>
      </div>
      <button class="btn danger" data-action="del-player" data-id="${esc(p.id)}">${I.close}<span>Aus dem Spiel nehmen</span></button>`;
  } else if (modal === 'steps'){
    const c = ctxOf(g);
    inner = `${head(`Ablauf · Nacht ${g.night}`)}
      <div class="steplist">${(c ? c.steps : []).map((s, i) => `
        <button class="srow ${i === g.stepIdx ? 'cur' : ''} ${i < g.stepIdx ? 'done' : ''} ${s.gone ? 'gone' : ''}" data-action="jump" data-idx="${i}">
          ${art(s.key === 'lovers' ? 'cupid' : s.key === 'enchanted' ? 'piper' : s.role, 'sthumb')}
          <span class="ptext"><b>${esc(s.label)}</b><small>${s.gone ? 'nicht mehr im Spiel' : s.act ? 'mit Aktion' : 'nur aufwecken'}</small></span>
          <span class="sstate">${i < g.stepIdx ? I.check : i === g.stepIdx ? I.right : ''}</span>
        </button>`).join('')}</div>`;
  } else if (modal === 'seats'){
    inner = `${head('Sitzordnung')}<p class="mtext small">Wichtig für Fuchs, Bärenführer und Ritter. Im Uhrzeigersinn, Platz 1 oben.</p>${seatCircle(g)}`;
  } else if (modal.startsWith('confirm:')){
    const [t, txt, action, label] = CONFIRM[modal.slice(8)];
    inner = `<h3 class="title">${t}</h3><p class="mtext">${txt}</p>
      <div class="bar"><button class="btn" data-action="close-modal">Abbrechen</button><button class="btn primary" data-action="${action}">${label}</button></div>`;
  }
  return `<div class="backdrop ${sheet ? 'is-sheet' : ''}" data-action="backdrop"><div class="modal ${sheet ? 'sheet' : ''}">${inner}</div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if (state.view === 'game' && !state.game) state.view = 'home';
  const g = state.game;
  document.body.classList.toggle('is-day', state.view === 'game' && g && (g.phase === 'day' || (g.phase === 'interrupt' && g.resume === 'day')));
  const v = state.view;
  app.className = 'v-' + v;
  app.innerHTML = (v === 'home' ? renderHome() : v === 'setup' ? renderWizard() : v === 'settings' ? renderSettings()
    : v === 'library' ? renderLibrary() : v === 'guide' ? renderGuide() : renderGame()) + renderModal();
  const act = document.querySelector('.steps .chip.active');
  if (act) act.scrollIntoView({block:'nearest', inline:'center'});
  save();
}

/* ================= Timer & Wake-Lock ================= */
function stopTimer(){ timer.running = false; clearInterval(timer.h); }
function resetTimer(){ stopTimer(); timer.left = state.options.timer; }
function tick(){
  timer.left = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
  const el = document.getElementById('timer-val');
  if (el) el.textContent = fmt(timer.left);
  if (timer.left === 0){ stopTimer(); buzz([400,150,400,150,600]); toast('Die Zeit ist um!'); render(); }
}
let wl = null;
async function applyWakeLock(){
  try {
    const want = state.options.wakeLock && state.view === 'game' && document.visibilityState === 'visible';
    if (want && !wl && 'wakeLock' in navigator){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if (!want && wl){ await wl.release(); wl = null; }
  } catch(e) {}
}
document.addEventListener('visibilitychange', applyWakeLock);

/* ================= Eingaben ================= */
function tapPlayer(pid){
  const g = state.game;
  if (!g || g.phase === 'ended') return;
  const d = g.draft;

  if (g.phase === 'interrupt'){
    const it = g.interrupts[0];
    if (it.type === 'maid') return;
    if (it.type === 'scapegoat'){
      if (!alive(g,pid)) return;
      it.picks = it.picks || [];
      const i = it.picks.indexOf(pid); if (i >= 0) it.picks.splice(i,1); else it.picks.push(pid);
      return;
    }
    if (it.type === 'hunter'){
      if (pid === it.id || !alive(g,pid)) return;
      g.interrupts.shift();
      const before = new Set(Object.keys(g.dead));
      kill(g, pid, 'Schuss des Jägers');
      if (g.resume === 'day') g.lastDeaths.push(...Object.keys(g.dead).filter(x => !before.has(x)));
    } else {
      if (!alive(g,pid)) return;
      g.interrupts.shift(); g.captain = pid; log(g, `Neuer Hauptmann: ${nm(pid)}`);
    }
    afterDeaths(g, g.resume);
    return;
  }
  if (g.phase === 'day'){
    if (!alive(g,pid)) return;
    if (g.dayMode === 'captain'){ g.captain = pid; g.dayMode = 'vote'; log(g, `Hauptmann: ${nm(pid)}`); return; }
    d.vote = d.vote === pid ? null : pid;
    return;
  }

  const c = ctxOf(g);
  if (!c || c.step.info || c.step.gone) return;
  const {step, r, mode, need} = c;

  if (mode === 'assign'){
    if (!r) return;
    if (g.roles[pid] === r.id && pid !== g.thiefId){ delete g.roles[pid]; }
    else if (pid === g.thiefId && r.id === 'thief'){ return toast('Der Dieb hat schon getauscht.'); }
    else {
      const ex = holders(g, r.id);
      if (ex.length >= need){
        if (need === 1 && ex[0].id !== g.thiefId) delete g.roles[ex[0].id];
        else return toast(`Schon ${need} zugeordnet – erst jemanden abwählen.`);
      }
      delete g.auto[pid];
      g.roles[pid] = r.id;
    }
    reconcileAuto(g);
    if (holders(g, r.id).length >= need && step.act) g.subMode = 'action';
    return;
  }
  if (mode !== 'action') return;
  if (!alive(g,pid)) return;
  const tog = (k) => { d[k] = d[k] === pid ? null : pid; };
  switch (step.act){
    case 'kill':
      if (isWolf(g,pid)) return toast('Werwölfe fressen keine Werwölfe.');
      tog('kill'); if (!d.kill){ d.infect = false; d.heal = false; }
      break;
    case 'check':
      if (holders(g,'seer').some(x => x.id === pid)) return;
      tog('check'); break;
    case 'witch':
      if (g.poisonMode){ d.poison = d.poison === pid ? null : pid; g.poisonMode = false; }
      else if (pid === d.kill && !g.potions.heal) d.heal = !d.heal;
      else if (!g.potions.poison) d.poison = d.poison === pid ? null : pid;
      break;
    case 'lovers': {
      const i = d.lovers.indexOf(pid);
      if (i >= 0) d.lovers.splice(i,1); else if (d.lovers.length < 2) d.lovers.push(pid); else toast('Schon 2 Verliebte gewählt.');
      break;
    }
    case 'protect':
      if (pid === g.lastProtect) return toast('Nicht zweimal hintereinander dieselbe Person.');
      tog('protect'); break;
    case 'bigkill':
      if (isWolf(g,pid)) return; tog('bigkill'); break;
    case 'whitekill':
      if (!isWolf(g,pid) || g.roles[pid] === 'whitewolf') return toast('Nur andere Werwölfe antippbar.'); tog('whitekill'); break;
    case 'model':
      if (holders(g,'wildchild').some(x => x.id === pid)) return; tog('model'); break;
    case 'fox': tog('fox'); break;
    case 'mark': tog('mark'); break;
    case 'enchant': {
      if (g.roles[pid] === 'piper' || g.enchanted[pid]) return toast('Bereits verzaubert oder Flötenspieler.');
      const i = d.enchant.indexOf(pid);
      if (i >= 0) d.enchant.splice(i,1); else if (d.enchant.length < 2) d.enchant.push(pid);
      break;
    }
    default: toast('Diese Aktion wird oben über die Knöpfe gewählt.');
  }
}

/* ================= Eingaben ================= */
const IS_APP = /; wv\)/.test(navigator.userAgent) || /WerwolfApp/.test(navigator.userAgent);
const NO_UNDO = new Set(['steps-modal','seat-view','seats','seat-tap','seat-shuffle','seat-reverse','clear-now','deal-toggle','overview','set-mode','open-menu','close-modal','backdrop','undo','show-log','show-roles','role-info',
  'timer-toggle','timer-reset','timer-preset','set-tab','download-html','go','back','new-game','wiz-next','wiz-back','player-sheet','ask','opt','recommend','balance']);

function doStart(){
  modal = null;
  if (setupProblems().length){ state.view = 'setup'; state.wizStep = 2; toast('Bitte zuerst Spieler und Rollen prüfen.'); return; }
  const g = newGame();
  if (cnt('actor')) pickActorPool(g);
  if (cnt('greis')) makeGroups(g);
  g.digital = state.options.mode === 'digital';
  if (g.digital){ dealRoles(g); g.phase = 'deal'; } else g.phase = 'intro';
  state.game = g; undoStack = []; state.view = 'game'; resetTimer();
  applyWakeLock(); buzz(30);
}
function goBack(){
  if (modal){ modal = null; return true; }
  if (state.view === 'setup'){ if (state.wizStep > 0) state.wizStep--; else state.view = 'home'; return true; }
  if (['settings','library','guide'].includes(state.view)){ state.view = (state.prevView === 'game' && state.game) ? 'game' : 'home'; return true; }
  if (state.view === 'game'){ modal = 'menu'; return true; }
  return false;
}
try { window.history.pushState({ww:1}, ''); } catch(e) {}
let exitArmed = false;
window.addEventListener('popstate', () => {
  if (goBack()){ exitArmed = false; try { window.history.pushState({ww:1}, ''); } catch(e) {} render(); return; }
  // Auf dem Startbildschirm: nächstes „Zurück“ beendet die App
  if (!exitArmed){ exitArmed = true; toast('Nochmal „Zurück“ zum Beenden'); setTimeout(() => { if (exitArmed){ exitArmed = false; try { window.history.pushState({ww:1}, ''); } catch(e) {} } }, 2500); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (a === 'backdrop' && e.target !== el) return;
  const g = state.game;
  const before = g ? JSON.stringify(g) : null;

  switch (a){
    /* --- Navigation --- */
    case 'go': {
      const v = el.dataset.view;
      if (v === 'game' && !state.game) break;
      if (['settings','library','guide'].includes(v)) state.prevView = state.view === 'game' ? 'game' : 'home';
      state.view = v; modal = null;
      if (v !== 'game') stopTimer();
      applyWakeLock(); break;
    }
    case 'back': goBack(); break;
    case 'new-game': state.view = 'setup'; state.wizStep = 0; modal = null; break;
    case 'wiz-next': if (state.wizStep < 3) state.wizStep++; break;
    case 'wiz-back': if (state.wizStep > 0) state.wizStep--; else state.view = 'home'; break;
    case 'set-tab': state.libSet = el.dataset.set; break;
    case 'seat-view': state.seatView = el.dataset.v; seatPick = null; break;
    case 'seats': modal = 'seats'; seatPick = null; break;
    case 'seat-tap': {
      const id = el.dataset.id;
      if (!seatPick) seatPick = id;
      else if (seatPick === id) seatPick = null;
      else {
        const i = state.players.findIndex(p => p.id === seatPick), j = state.players.findIndex(p => p.id === id);
        if (i >= 0 && j >= 0){ [state.players[i], state.players[j]] = [state.players[j], state.players[i]]; buzz(15); }
        seatPick = null;
      }
      break;
    }
    case 'seat-shuffle':
      for (let i = state.players.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [state.players[i], state.players[j]] = [state.players[j], state.players[i]]; }
      seatPick = null; break;
    case 'seat-reverse': state.players = [state.players[0], ...state.players.slice(1).reverse()].filter(Boolean); seatPick = null; break;
    case 'clear-now': state.players = []; syncVillagers(); modal = null; seatPick = null; toast('Alle Spieler gelöscht'); break;
    case 'set-mode': state.options.mode = el.dataset.mode; break;
    case 'ask': modal = 'confirm:' + el.dataset.what; break;

    /* --- Einrichtung --- */
    case 'player-sheet': modal = 'player:' + el.dataset.id; break;
    case 'move': {
      const i = state.players.findIndex(x => x.id === el.dataset.id), j = i + Number(el.dataset.dir);
      if (i >= 0 && j >= 0 && j < state.players.length) [state.players[i], state.players[j]] = [state.players[j], state.players[i]];
      break;
    }
    case 'del-player': state.players = state.players.filter(p => p.id !== el.dataset.id); syncVillagers(); modal = null; break;
    case 'role-inc': {
      const id = el.dataset.role, r = RM[id];
      state.counts[id] = cnt(id) + (cnt(id) === 0 && r.def ? r.def : 1);
      if (id !== 'villager') syncVillagers(); break;
    }
    case 'role-dec': {
      const id = el.dataset.role, r = RM[id];
      state.counts[id] = (r.def && cnt(id) === r.def) ? 0 : Math.max(0, cnt(id) - 1);
      if (id !== 'villager') syncVillagers(); break;
    }
    case 'balance': syncVillagers(); break;
    case 'recommend': recommend(); toast(`Empfehlung für ${state.players.length} Spieler geladen`); break;
    case 'opt': {
      const k = el.dataset.key; state.options[k] = !state.options[k];
      if (k === 'expansions' && !state.options.expansions){ ROLES.filter(r => r.set !== 'basis').forEach(r => delete state.counts[r.id]); syncVillagers(); state.libSet = 'basis'; }
      if (k === 'expansions' && state.options.expansions) state.libSet = 'neumond';
      if (k === 'wakeLock') applyWakeLock();
      if (k === 'revealRoles') modal = null;
      break;
    }
    case 'start': if (gameRunning()) modal = 'confirm:start'; else doStart(); break;
    case 'restart': if (gameRunning()) modal = 'confirm:restart'; else doStart(); break;
    case 'start-now': case 'restart-now': doStart(); break;
    case 'reset-now': state = defaultState(); undoStack = []; modal = null; break;

    /* --- Verteilen & Start --- */
    case 'deal-toggle': if (g && g.phase === 'deal'){ g.dealShown = !g.dealShown; buzz(15); } break;
    case 'deal-prev': if (g.dealShown) g.dealShown = false; else if (g.dealIdx > 0) g.dealIdx--; break;
    case 'deal-next':
      g.dealShown = false;
      if (g.dealIdx < state.players.length - 1) g.dealIdx++;
      else g.phase = 'intro';
      break;
    case 'overview': modal = 'overview'; break;
    case 'deal-reroll': dealRoles(g); g.dealIdx = 0; g.dealShown = false; modal = null; toast('Rollen neu ausgelost'); break;
    case 'begin-night': g.phase = 'night'; g.stepIdx = 0; log(g, '— Nacht 1 beginnt —'); buzz(40); break;

    /* --- Nacht --- */
    case 'tap': tapPlayer(el.dataset.id); buzz(12); break;
    case 'submode': if (g){ g.subMode = el.dataset.mode; g.poisonMode = false; } break;
    case 'jump': if (g){ g.stepIdx = Number(el.dataset.idx); g.subMode = null; g.poisonMode = false; } if (modal === 'steps') modal = null; break;
    case 'steps-modal': modal = 'steps'; break;
    case 'prev': {
      const c = ctxOf(g);
      if (!g.digital && g.night === 1 && c && c.mode === 'action' && c.step.act) g.subMode = 'assign';
      else if (g.stepIdx > 0){ g.stepIdx--; g.subMode = null; }
      g.poisonMode = false; break;
    }
    case 'next': {
      const c = ctxOf(g);
      if (c && g.stepIdx < c.steps.length - 1){ g.stepIdx++; g.subMode = null; g.poisonMode = false; }
      else finishNight(g);
      break;
    }
    case 'toggle-phase': modal = null;
      if (g.phase === 'night') finishNight(g);
      else if (g.phase === 'day'){ log(g, 'Tag ohne Hinrichtung beendet'); endDay(g); }
      break;
    case 'witch-heal': if (g.draft.kill && !g.potions.heal){ g.draft.heal = !g.draft.heal; g.poisonMode = false; } break;
    case 'witch-poison':
      if (g.potions.poison) break;
      if (g.draft.poison){ g.draft.poison = null; g.poisonMode = false; } else g.poisonMode = !g.poisonMode;
      break;
    case 'infect': if (g.draft.kill) g.draft.infect = !g.draft.infect; break;
    case 'wolfdog': g.draft.side = g.draft.side === el.dataset.side ? null : el.dataset.side; break;
    case 'thief-role': {
      const tid = g.thiefId || holders(g,'thief')[0]?.id;
      if (!tid){ toast('Erst den Dieb zuordnen.'); break; }
      if (g.draft.thiefRole === el.dataset.role){ g.draft.thiefRole = null; g.roles[tid] = 'thief'; g.thiefId = null; }
      else { g.draft.thiefRole = el.dataset.role; g.thiefId = tid; g.roles[tid] = el.dataset.role; }
      break;
    }
    case 'random-roles': dealRoles(g); modal = null; toast('Rollen zufällig zugeteilt'); break;

    /* --- Tag --- */
    case 'daymode': g.dayMode = el.dataset.mode; break;
    case 'girl-caught': { const girl = livingHolders(g,'girl')[0]; if (girl){ g.draft.kill = g.draft.kill === girl.id ? null : girl.id; g.draft.infect = false; g.draft.heal = false; } break; }
    case 'actor-role': {
      const tid = g.actorId || holders(g,'actor')[0]?.id;
      if (!tid){ toast('Erst den Gaukler zuordnen.'); break; }
      const r = el.dataset.role;
      if (g.draft.actorRole === r){ g.draft.actorRole = null; g.roles[tid] = 'actor'; }
      else { g.draft.actorRole = r; g.actorId = tid; g.roles[tid] = r; }
      break;
    }
    case 'seance': g.draft.seance = el.dataset.v === '1'; break;
    case 'judge-sign': g.judgeArmed = !g.judgeArmed; break;
    case 'maid-take': {
      const it = g.interrupts.shift();
      if (it){ g.roles[it.id] = g.roles[it.victim]; g.maidUsed = true; log(g, `Ergebene Magd ${nm(it.id)} übernimmt die Rolle ${RM[g.roles[it.id]].name} von ${nm(it.victim)}`); toast(`${nm(it.id)} ist jetzt ${RM[g.roles[it.id]].name}`); }
      afterDeaths(g, g.resume); break;
    }
    case 'day-kill': {
      const v = g.draft.vote; if (!v) break;
      if (g.roles[v] === 'idiot' && !g.idiotRevealed && powerOn(g,'idiot')){ g.idiotRevealed = true; log(g, `Dorfdepp ${nm(v)} entlarvt – überlebt ohne Stimmrecht`); toast('Dorfdepp! Überlebt, darf aber nicht mehr abstimmen.'); }
      else {
        kill(g, v, 'Dorfgericht');
        const maid = livingHolders(g,'maid')[0];
        if (maid && !g.maidUsed && maid.id !== v && powerOn(g,'maid')) g.interrupts.unshift({type:'maid', id:maid.id, victim:v});
      }
      endDay(g); break;
    }
    case 'day-tie': {
      const sg = livingHolders(g,'scapegoat')[0];
      if (sg){ kill(g, sg.id, 'Sündenbock (Gleichstand)'); g.interrupts.push({type:'scapegoat', id:sg.id, picks:[]}); }
      endDay(g); break;
    }
    case 'day-none': log(g, 'Keine Hinrichtung'); endDay(g); break;
    case 'interrupt-skip': {
      const it = g.interrupts.shift();
      if (it && it.type === 'captain') g.captain = null;
      if (it && it.type === 'scapegoat'){ g.voters = [...(it.picks || [])]; g.votersDay = g.day + 1; log(g, `Sündenbock bestimmt die Wähler für morgen: ${g.voters.map(nm).join(', ') || 'niemand'}`); }
      afterDeaths(g, g.resume); break;
    }

    case 'timer-toggle':
      if (timer.running) stopTimer();
      else { if (timer.left === 0) timer.left = state.options.timer; timer.running = true; timer.endAt = Date.now() + timer.left * 1000; clearInterval(timer.h); timer.h = setInterval(tick, 250); }
      break;
    case 'timer-reset': resetTimer(); break;
    case 'timer-preset': { const P = [60,120,180,300,600]; state.options.timer = P[(P.indexOf(state.options.timer) + 1) % P.length]; resetTimer(); break; }

    /* --- Menü --- */
    case 'undo': if (undoStack.length){ state.game = JSON.parse(undoStack.pop()); modal = null; toast('Rückgängig gemacht'); } break;
    case 'open-menu': modal = 'menu'; break;
    case 'close-modal': case 'backdrop': modal = null; break;
    case 'show-log': modal = 'log'; break;
    case 'show-roles': modal = 'roles'; break;
    case 'role-info': modal = 'role:' + el.dataset.role; break;
    case 'download-html': modal = null; render(); downloadHtml(); return;
  }

  if (g && state.game === g && !NO_UNDO.has(a)){
    const after = JSON.stringify(g);
    if (after !== before){ undoStack.push(before); if (undoStack.length > 80) undoStack.shift(); }
  }
  render();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'add-form'){
    const inp = document.getElementById('add-inp');
    const names = (inp.value || '').split(/[,;\n]+/).map(s => s.trim().slice(0,20)).filter(Boolean);
    for (const name of names){
      if (!state.players.some(p => p.name.toLowerCase() === name.toLowerCase()))
        state.players.push({id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), name});
    }
    syncVillagers(); render();
    document.getElementById('add-inp')?.focus();
  } else if (e.target.id === 'rename-form'){
    const p = state.players.find(x => 'player:' + x.id === modal);
    const v = document.getElementById('rename-inp').value.trim().slice(0,20);
    if (p && v) p.name = v;
    modal = null; render();
  }
});

function downloadHtml(){
  try {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#app').innerHTML = '';
    clone.querySelector('#scene-night').innerHTML = '';
    clone.querySelector('#scene-day').innerHTML = '';
    const blob = new Blob(['<!doctype html>\n' + clone.outerHTML], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = Object.assign(document.createElement('a'), {href:url, download:'werwolf_spielleiter.html'});
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch(e) { toast('Speichern hier nicht möglich.'); }
}

buildScenes();
render();
applyWakeLock();
})();
